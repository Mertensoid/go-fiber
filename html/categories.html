{{ define "categories" }}
<div style="display: flex;">
    {{ range . }}
        <div style="
            text-align: center;
            width: 100px;
            background-color: #f0f0f0;
            padding: 5px;
            margin: 15px;
            border: 1px solid #ccc;
        ">
            <b>#{{ .Name }}</b>
        </div>
    {{ end }}
</div>
    
{{ end }}
